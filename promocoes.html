<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promoções</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
    <h2 class="titulo-promocoes">Promoções</h2>
    <nav>
            <div class="entrar">
            <a href="#">🛒</a>
            <a href="login.html">👤 Entrar</a>
        </div>
        </nav>
</header>
<section class="promocoes">
    <div class="promocao">
        <img src="imagens/promocao requeijao.jpg">

        <h3>🎉 Promoção de Inauguração</h3>
        <p>
            Na compra de qualquer pizza grande,
            ganhe borda de requeijão grátis!
        </p>
        <button>Aproveitar</button>
    </div>

    <div class="promocao">
        <img src="imagens/promocao frete.jpg">
        <h3>🚚 Frete Grátis</h3>
        <p>
            Faça seu pedido acima de
            <strong>R$ 150,00</strong>
            e ganhe entrega grátis.
        </p>
        <button>Aproveitar</button>
    </div>

    <div class="promocao">
        <img src="imagens/promocao refri.jpg">
        <h3>🍕 Pizza + Refrigerante</h3>
        <p>
            Comprando 2 pizzas,
            você ganha um refrigerante grátis!
        </p>
        <button>Aproveitar</button>
    </div>

</section>
</body>
</html>
